# Production stack: PostgreSQL, Django API, Caddy (HTTPS + app), nightly backups.
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: justsmile

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio_app}
      POSTGRES_USER: ${POSTGRES_USER:-studio_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published port: only the backend and backup containers can reach the database.

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/.env}
      DJANGO_ALLOWED_HOSTS: ${SITE_DOMAIN:?Set SITE_DOMAIN in deploy/.env}
      DJANGO_ALLOW_LOCALHOST_ONLY: ${DJANGO_ALLOW_LOCALHOST_ONLY:-false}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://${SITE_DOMAIN}}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://${SITE_DOMAIN}}
      DATABASE_URL: postgres://${POSTGRES_USER:-studio_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studio_app}
      SECURE_SSL_REDIRECT: "false"   # Caddy already redirects HTTP to HTTPS
      SECURE_HSTS_SECONDS: ${HSTS_SECONDS:-3600}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_PATH:-admin}/
      DJANGO_ADMINS: ${DJANGO_ADMINS:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Just Smile Empire <no-reply@localhost>}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRUSTED_PROXY_COUNT: "1"   # Caddy sits in front: rate limits use the visitor's address
      PUBLIC_SITE_ORGANIZATION_ID: ${PUBLIC_SITE_ORGANIZATION_ID:-}
    volumes:
      - private_media:/data/private_media

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN}}
      HSTS_SECONDS: ${HSTS_SECONDS:-3600}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-admin}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-studio_app}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-studio_app}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: ${TZ:-Africa/Monrovia}
    volumes:
      - ./backup:/scripts:ro
      - private_media:/data/private_media:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]

volumes:
  postgres_data:
  private_media:
  caddy_data:
  caddy_config:
